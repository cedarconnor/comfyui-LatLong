[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "latlong"
version = "2.1.0"
description = "Equirectangular geometry and editing workflows for ComfyUI"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "js/lib/THREE-LICENSE.txt"]
dependencies = ["numpy>=1.24", "opencv-python>=4.8", "scipy>=1.10", "torch>=2.0", "Pillow>=9.5"]

[project.urls]
Repository = "https://github.com/cedarconnor/comfyui-LatLong"

[tool.setuptools]
packages = ["latlong", "latlong.modules"]
package-dir = {latlong = ".", "latlong.modules" = "modules"}

[tool.setuptools.package-data]
latlong = ["js/*.js", "js/lib/*.js", "js/lib/*LICENSE*"]

[tool.comfy]
PublisherId = ""
DisplayName = "comfyui-LatLong"
Icon = ""
